---
- name: Install Clickhouse
  hosts: clickhouse
  tags: clickhouse
  handlers:
    - name: Stop clickhouse service
      become: true
      ansible.builtin.systemd_service:
        name: clickhouse-server
        state: stopped
      listen: "Start clickhouse service"
      when: not ansible_check_mode

    - name: Wait for ClickHouse socket to free up
      ansible.builtin.pause:
        seconds: 3
      listen: "Start clickhouse service"
      when: not ansible_check_mode

    - name: Start clickhouse service again
      become: true
      ansible.builtin.systemd_service:
        name: clickhouse-server
        state: started
      listen: "Start clickhouse service"
      when: not ansible_check_mode

  tasks:
    - name: Download ClickHouse all DEB packages
      ansible.builtin.get_url:
        url: "https://packages.clickhouse.com/deb/pool/main/c/{{ item }}/{{ item }}_{{ clickhouse_version }}_all.deb"
        dest: "/tmp/{{ item }}_{{ clickhouse_version }}_all.deb"
        mode: '0644'
      with_items:
        - "clickhouse-client"
        - "clickhouse-server"
      check_mode: false

    - name: Check if ClickHouse static DEB already exists
      ansible.builtin.stat:
        path: "/tmp/clickhouse-common-static_{{ clickhouse_version }}_amd64.deb"
      register: clickhouse_static_file

    - name: Download ClickHouse static amd64 DEB package via wget
      ansible.builtin.command: >
        wget -q -O "/tmp/clickhouse-common-static_{{ clickhouse_version }}_amd64.deb"
        "https://packages.clickhouse.com/deb/pool/main/c/clickhouse-common-static/clickhouse-common-static_{{ clickhouse_version }}_amd64.deb"
      when: not clickhouse_static_file.stat.exists
      register: wget_download
      changed_when: not clickhouse_static_file.stat.exists
      check_mode: false
      tags:
        - skip_ansible_lint

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Install clickhouse DEB packages
      become: true
      ansible.builtin.apt:
        deb: "{{ item }}"
      with_items:
        - "/tmp/clickhouse-common-static_{{ clickhouse_version }}_amd64.deb"
        - "/tmp/clickhouse-client_{{ clickhouse_version }}_all.deb"
        - "/tmp/clickhouse-server_{{ clickhouse_version }}_all.deb"
      when:
        - not ansible_check_mode
        - "'clickhouse-server' not in ansible_facts.packages"

    - name: Allow external connections in main ClickHouse config
      become: true
      ansible.builtin.replace:
        path: /etc/clickhouse-server/config.xml
        regexp: '<!--\s*<listen_host>0\.0\.0\.0</listen_host>\s*-->'
        replace: '<listen_host>0.0.0.0</listen_host>'
      notify: Start clickhouse service
      when: not ansible_check_mode

    - name: Flush handlers to ensure service is started
      ansible.builtin.meta: flush_handlers

    - name: Ensure ClickHouse service is started and enabled
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: started
        enabled: true
      when: not ansible_check_mode

    - name: Wait for ClickHouse server to start listening on port 9000
      ansible.builtin.wait_for:
        port: 9000
        delay: 3
        timeout: 30
        state: started

    - name: Create database
      ansible.builtin.command: "clickhouse-client --host 127.0.0.1 -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc != 82
      changed_when: create_db.rc == 0

- name: Install and configure Vector
  hosts: vector
  tags: vector
  handlers:
    - name: Restart vector service
      become: true
      ansible.builtin.systemd_service:
        name: vector
        state: restarted
      when: not ansible_check_mode
  tasks:
    - name: Ensure Vector configuration directory exists
      become: true
      ansible.builtin.file:
        path: "{{ vector_config_dir }}"
        state: directory
        mode: '0755'

    - name: Check if Vector DEB already exists
      ansible.builtin.stat:
        path: "/tmp/vector_{{ vector_version }}-1_amd64.deb"
      register: vector_deb_file

    - name: Download Vector DEB package via wget
      ansible.builtin.command: >
        wget -q -O "/tmp/vector_{{ vector_version }}-1_amd64.deb"
        "https://install.datadoghq.com/vector/{{ vector_version }}/vector_{{ vector_version }}-1_amd64.deb"
      when: not vector_deb_file.stat.exists
      register: wget_vector_download
      changed_when: not vector_deb_file.stat.exists
      check_mode: false
      tags:
        - skip_ansible_lint

    - name: Install Vector DEB package via APT
      become: true
      ansible.builtin.apt:
        deb: "/tmp/vector_{{ vector_version }}-1_amd64.deb"

    - name: Deploy Vector configuration from template
      become: true
      ansible.builtin.template:
        src: templates/vector.yaml.j2
        dest: "{{ vector_config_dir }}/vector.yaml"
        mode: '0644'
      notify: Restart vector service

    - name: Start and enable Vector service
      become: true
      ansible.builtin.systemd_service:
        name: vector
        enabled: true
        state: started
      when: not ansible_check_mode

- name: Install and configure LightHouse
  hosts: lighthouse
  tags: lighthouse
  handlers:
    - name: Restart nginx service
      become: true
      ansible.builtin.service:
        name: nginx
        state: restarted
      when: not ansible_check_mode
  tasks:
    - name: Install Nginx and unzip packages
      become: true
      ansible.builtin.apt:
        name:
          - nginx
          - unzip
        state: present
        update_cache: true

    - name: Create web-root directory for LightHouse
      become: true
      ansible.builtin.file:
        path: "{{ lighthouse_install_dir }}"
        state: directory
        mode: '0755'
      check_mode: false

    - name: Download LightHouse static zip archive
      ansible.builtin.get_url:
        url: "https://github.com/VKCOM/lighthouse/archive/refs/heads/{{ lighthouse_version }}.zip"
        dest: "/tmp/lighthouse-{{ lighthouse_version }}.zip"
        mode: '0644'
      check_mode: false

    - name: Unarchive LightHouse static files
      become: true
      ansible.builtin.unarchive:
        src: "/tmp/lighthouse-{{ lighthouse_version }}.zip"
        dest: "{{ lighthouse_install_dir }}"
        remote_src: true

    - name: Deploy Nginx configuration for LightHouse
      become: true
      ansible.builtin.template:
        src: templates/lighthouse.conf.j2
        dest: "{{ lighthouse_config_dir }}/lighthouse.conf"
        mode: '0644'
      notify: Restart nginx service

    - name: Start and enable Nginx service
      become: true
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started
      when: not ansible_check_mode
